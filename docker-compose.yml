services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: judging
      POSTGRES_PASSWORD: judging
      POSTGRES_DB: judging
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judging -d judging"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://judging:judging@db:5432/judging
      JWT_SECRET: dev-only-change-me
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
